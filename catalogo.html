<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo · Nuvora</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
  body{background:#020409;color:#EAF2FF;min-height:100vh;padding:18px 14px 60px}
  .wrap{max-width:560px;margin:0 auto}
  header{text-align:center;padding:22px 0 18px}
  .brand{font-weight:900;letter-spacing:6px;font-size:14px;color:#6FA8FF;text-shadow:0 0 18px rgba(77,166,255,.55)}
  h1{font-size:24px;font-weight:900;margin-top:10px}
  .sub{color:#8EA3C8;font-size:13px;margin-top:6px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
  .prod{background:rgba(8,16,34,.75);border:1px solid rgba(90,170,255,.20);border-radius:16px;padding:14px;backdrop-filter:blur(8px)}
  .prod .phf{width:100%;height:120px;object-fit:cover;border-radius:12px;margin-bottom:10px;background:#0a1428}
  .prod .ph{height:74px;border-radius:12px;background:linear-gradient(135deg,rgba(44,229,155,.14),rgba(77,166,255,.14));display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:10px}
  .prod .nm{font-weight:800;font-size:14px}
  .prod .pr{color:#2CE59B;font-weight:900;font-size:16px;margin-top:3px}
  .prod .dt{color:#8EA3C8;font-size:11.5px;margin-top:5px;line-height:1.4}
  .empty{text-align:center;color:#8EA3C8;padding:60px 20px;font-size:14px;line-height:1.6}
  footer{margin-top:34px;text-align:center}
  footer .cta{display:inline-block;background:linear-gradient(135deg,#00D4FF,#4DA6FF);color:#02131F;font-weight:900;padding:12px 22px;border-radius:14px;text-decoration:none;font-size:14px;box-shadow:0 8px 26px rgba(0,212,255,.35)}
  footer p{color:#8EA3C8;font-size:11.5px;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">NUVORA</div>
    <h1 id="biz">Catálogo</h1>
    <div class="sub">Pide el tuyo escribiendo al negocio</div>
  </header>
  <div class="grid" id="grid"></div>
  <footer>
    <a class="cta" href="https://nuvora-ve.github.io">Crea tu catálogo gratis con Nuvora</a>
    <p>Nuvora — tu plata y tu negocio bajo control · nuvora-ve.github.io</p>
  </footer>
</div>
<script>
(function(){
  var grid=document.getElementById('grid');
  try{
    var h=location.hash||'';
    var m=h.match(/#d=([A-Za-z0-9\-_]+)/);
    if(!m) throw 0;
    var b64=m[1].replace(/-/g,'+').replace(/_/g,'/');while(b64.length%4)b64+='=';
    var data=JSON.parse(decodeURIComponent(escape(atob(b64))));
    if(data.n) document.getElementById('biz').textContent=data.n;
    document.title='Catálogo de '+(data.n||'Nuvora');
    var items=data.p||[];
    if(!items.length) throw 0;
    grid.innerHTML=items.map(function(it){
      var foto=(it[3]&&/^https:\/\//.test(it[3]))?it[3]:'';
      return '<div class="prod">'+
        (foto?'<img class="phf" src="'+foto+'" alt="" loading="lazy">':'<div class="ph">🛍️</div>')+
        '<div class="nm"></div><div class="pr"></div>'+
        (it[2]?'<div class="dt"></div>':'')+'</div>';
    }).join('');
    items.forEach(function(it,i){
      var el=grid.children[i];
      el.querySelector('.nm').textContent=it[0];
      el.querySelector('.pr').textContent=it[1];
      if(it[2]) el.querySelector('.dt').textContent=it[2];
    });
  }catch(e){
    grid.innerHTML='<div class="empty" style="grid-column:1/-1">Este catálogo no tiene productos o el enlace está incompleto.<br>Pídele al negocio que te envíe el enlace completo desde Nuvora.</div>';
  }
})();
</script>
</body>
</html>
