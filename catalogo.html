<body><main class="wrap"><nav class="nav"><div class="brand"><span class="nmark">N</span>NUVORA</div><span class="secure">Catálogo digital</span></nav><section id="app"></section></main><div id="cartbar" class="cartbar"><div class="cartmini"><strong id="cartcount">0 productos</strong><span id="carttotal">Total 0</span></div><button id="openCart" class="open-cart">Ver pedido</button></div><div id="shade" class="shade"></div><section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="Tu pedido"><div class="sheet-inner"><div class="grab"></div><h2>Tu pedido</h2><div class="hint">Revisa las cantidades antes de enviarlo al negocio.</div><div id="cartlines"></div><div class="total"><span>Total</span><span id="sheetTotal">0</span></div><div class="fields"><input id="clientName" class="field" autocomplete="name" placeholder="Tu nombre (opcional)" aria-label="Tu nombre"><textarea id="clientNote" class="field" rows="3" placeholder="Nota del pedido (opcional)" aria-label="Nota del pedido"></textarea></div><button id="sendOrder" class="send">Enviar pedido por WhatsApp</button><div class="note">El pedido no descuenta inventario automáticamente. El negocio confirma la venta en Nuvora antes de descontar stock, evitando ventas falsas o pérdidas de inventario.</div></div></section><div id="toast" class="toast" role="status">Agregado al pedido</div>
<script>(async function(){const root=document.getElementById('app'),cartbar=document.getElementById('cartbar'),sheet=document.getElementById('sheet'),shade=document.getElementById('shade'),lines=document.getElementById('cartlines'),toast=document.getElementById('toast');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const decode64=raw=>{let b64=raw.replace(/-/g,'+').replace(/_/g,'/');while(b64.length%4)b64+='=';return new TextDecoder().decode(Uint8Array.from(atob(b64),c=>c.charCodeAt(0)))};const cart=new Map();let ctx={name:'Negocio',digits:'',currency:'$',products:[]};const parseAmount=p=>{if(Number.isFinite(Number(p.amount)))return Number(p.amount);const raw=String(p.price||'').replace(/[^0-9,.-]/g,'');if(!raw)return 0;const clean=raw.includes(',')&&raw.includes('.')?(raw.lastIndexOf(',')>raw.lastIndexOf('.')?raw.replace(/\./g,'').replace(',','.') :raw.replace(/,/g,'')):raw.replace(',','.');return Number(clean)||0};const money=n=>`${ctx.currency} ${Number(n||0).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2})}`;const norm=(p,i)=>{if(Array.isArray(p))return{id:String(p[5]||i),name:p[0]||'',price:p[1]||'',detail:p[2]||'',photo:p[3]||'',stock:Number(p[4]??999999),amount:Number(p[6]??NaN),currency:p[7]||''};const live=('nombre'in p)||('precio'in p)||('foto_url'in p);if(live)return{id:String(p.id||i),name:p.nombre||'',price:'',detail:p.descripcion||'',photo:p.foto_url||'',stock:Number(p.stock??0),amount:Number(p.precio??0),currency:p.moneda||''};return{id:String(p.id||i),name:p.name||'',price:p.price||'',detail:p.detail||'',photo:p.photo||'',stock:Number(p.stock??999999),amount:Number(p.amount??NaN),currency:p.currency||''}};const showToast=()=>{toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),1200)};function updateCart(){let units=0,total=0;for(const[id,q]of cart){const p=ctx.products.find(x=>x.id===id);if(!p)continue;units+=q;total+=parseAmount(p)*q}document.getElementById('cartcount').textContent=`${units} ${units===1?'producto':'productos'}`;document.getElementById('carttotal').textContent=`Total ${money(total)}`;document.getElementById('sheetTotal').textContent=money(total);cartbar.classList.toggle('show',units>0);renderCart()}function renderCart(){lines.innerHTML='';for(const[id,q]of cart){const p=ctx.products.find(x=>x.id===id);if(!p)continue;const row=document.createElement('div');row.className='cartline';row.innerHTML=`<div><div class="cartline-name">${esc(p.name)}</div><div class="cartline-price">${esc(p.price||money(parseAmount(p)))} c/u</div></div><div class="qty"><button class="qbtn" data-act="minus" aria-label="Quitar una unidad">−</button><div class="qnum">${q}</div><button class="qbtn" data-act="plus" aria-label="Agregar una unidad">+</button></div>`;row.querySelector('[data-act=minus]').onclick=()=>setQty(id,q-1);row.querySelector('[data-act=plus]').onclick=()=>setQty(id,q+1);lines.appendChild(row)}document.getElementById('sendOrder').disabled=!ctx.digits||cart.size===0}function setQty(id,q){const p=ctx.products.find(x=>x.id===id);if(!p)return;const max=Math.max(0,Math.floor(Number.isFinite(p.stock)?p.stock:999999));if(q<=0)cart.delete(id);else cart.set(id,Math.min(q,max||0));updateCart()}function openSheet(){shade.classList.add('show');sheet.classList.add('show');document.body.style.overflow='hidden'}function closeSheet(){shade.classList.remove('show');sheet.classList.remove('show');document.body.style.overflow=''}document.getElementById('openCart').onclick=openSheet;shade.onclick=closeSheet;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});document.getElementById('sendOrder').onclick=()=>{if(!ctx.digits||!cart.size)return;const client=document.getElementById('clientName').value.trim(),note=document.getElementById('clientNote').value.trim();let total=0,units=0;const parts=[];for(const[id,q]of cart){const p=ctx.products.find(x=>x.id===id);if(!p)continue;const subtotal=parseAmount(p)*q;total+=subtotal;units+=q;parts.push(`• ${q} x ${p.name} — ${money(subtotal)}`)}const msg=[`Hola, quiero hacer este pedido en ${ctx.name}:`,'',...parts,'',`Total: ${money(total)}`,client?`Nombre: ${client}`:'',note?`Nota: ${note}`:'','',`Pedido preparado desde el catálogo de Nuvora (${units} ${units===1?'producto':'productos'}).`].filter(Boolean).join('\n');window.open(`https://wa.me/${ctx.digits}?text=${encodeURIComponent(msg)}`,'_blank','noopener')};function render(name,products,meta={}){const logo=meta.logo||'',desc=meta.description||'Productos, precios y disponibilidad actualizados desde Nuvora.',digits=String(meta.whatsapp||'').replace(/\D/g,'');ctx={name:name||'Negocio',digits,currency:meta.currency||'',products:products.map(norm)};if(!ctx.currency){const first=ctx.products[0];ctx.currency=first?.currency||String(first?.price||'').trim().split(/\s+/)[0]||'$'}const cards=ctx.products.map(p=>{const amount=parseAmount(p),stock=Number.isFinite(p.stock)?p.stock:999999,max=Math.max(0,Math.floor(stock)),out=max<=0,visual=p.photo?`<div class="visual"><img class="photo" src="${esc(p.photo)}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><div class="ph" style="display:none">◇</div><span class="badge">${out?'AGOTADO':'DISPONIBLE'}</span></div>`:`<div class="visual"><div class="ph">◇</div><span class="badge">${out?'AGOTADO':'DISPONIBLE'}</span></div>`;return`<article class="item" data-name="${esc(p.name.toLowerCase())}">${visual}<div class="body"><div class="name">${esc(p.name)}</div><div class="price">${esc(p.price||money(amount))}</div>${p.detail?`<div class="detail">${esc(p.detail)}</div>`:''}<div class="stock ${out?'out':''}">${out?'Sin stock':(stock<999999?`${Math.floor(stock)} en existencia`:'En existencia')}</div><button class="add" data-add="${esc(p.id)}" ${out?'disabled':''}>${out?'Agotado':'Agregar al pedido'}</button></div></article>`}).join eCount').textContent=`${visible} ${visible===1?'producto':'productos'}`});updateCart()}async function completarFotos(data){try{const res=await fetch('https://nuvora-subida.juanplateado1224444.workers.dev/lista',{cache:'no-store'});if(!res.ok)return;const j=await res.json(),fotos=j.fotos||[],carpeta=f=>String(f.archivo||'').split('/')[0],buscar=id=>fotos.find(f=>carpeta(f).endsWith('-'+id))?.url||'';if(!data.l&&!data.logo){const lg=fotos.find(f=>carpeta(f).endsWith('-logo'));if(lg){data.l=lg.url;data.logo=lg.url}}(data.p||data.products||[]).forEach(p=>{const arr=Array.isArray(p),id=arr?String(p[5]||''):String(p.id||''),tiene=arr?p[3]:p.photo;if(id&&!tiene){const u=buscar(id);if(u){if(arr)p[3]=u;else p.photo=u}}})}catch(e){}}try{const live=location.hash.match(/(?:^#|&)c=([^&]+)/);if(live){root.innerHTML='<div class="hero"><div class="eyebrow">NUVORA</div><h1>Cargando catálogo…</h1><p class="sub">Consultando productos y disponibilidad actual.</p></div>';const id=decodeURIComponent(live[1]);if(!/^[A-Za-z0-9_-]{1,120}$/.test(id))throw new Error('Enlace de catálogo no válido.');const res=await fetch('https://nuvora-subida.juanplateado1224444.workers.dev/catalogo/'+encodeURIComponent(id),{cache:'no-store'});if(!res.ok)throw new Error(res.status===404?'Este catálogo no está publicado.':'No se pudo cargar el catálogo.');const body=await res.json(),data=body.catalogo||{};render(data.nombre,Array.isArray(data.productos)?data.productos:[],{logo:data.logo||data.logo_url||'',description:data.descripcion||'',whatsapp:data.whatsapp||'',currency:data.moneda||''});return}const cloud=location.hash.match(/(?:^#|&)u=([^&]+)/);if(cloud){const url=decode64(cloud[1]);if(!/^https:\/\//i.test(url))throw new Error('Enlace de catálogo no válido.');const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error('No se pudo cargar el catálogo.');const data=await res.json();await completarFotos(data);render(data.name,Array.isArray(data.products)?data.products:[],{logo:data.logo||'',descr
